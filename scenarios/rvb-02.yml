- id: RVB-02-S2
  name: Scheduled task persistence
  technique: T1053.005
  red: A task is created to run a binary from a user-writable path.
  blue:
    expect: detected
    rules:
    - SOC-RULE-003
    question: What does the task run, and as whom?
  events:
  - event_id: 4698
    event_source: Security
    details:
      TaskContent: <Exec><Command>powershell.exe</Command><Arguments>-WindowStyle Hidden -Enc AAA</Arguments></Exec>
    computer_name: CORP-FINANCE-02
    timestamp: '2026-11-01T09:14:00Z'
    technique_id: T1053.005
- id: RVB-02-S3
  name: Shadow copies deleted
  technique: T1490
  red: vssadmin removes every shadow copy.
  blue:
    expect: detected
    rules:
    - SOC-RULE-019
    question: Are backups for this host stored off the host?
  events:
  - event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: C:\Windows\System32\vssadmin.exe
      CommandLine: vssadmin.exe Delete Shadows /All /Quiet
      ParentImage: C:\Users\Public\locker.exe
    computer_name: CORP-FINANCE-02
    timestamp: '2026-11-01T09:21:00Z'
    technique_id: T1490
- id: RVB-02-S4
  name: Canary file encrypted
  technique: T1486
  red: A ransomware canary file is rewritten.
  blue:
    expect: detected
    rules:
    - SOC-RULE-006
    question: How many other files did the same process write?
  events:
  - event_id: 11
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      TargetFilename: C:\Users\f\Documents\Decoy.xlsx.locked
    computer_name: CORP-FINANCE-02
