# Documentation site (roadmap F81): python -m mkdocs serve  /  python -m mkdocs build --strict
site_name: CyberPulse SOC Suite
site_description: Detection engineering and human-in-the-loop SOAR lab. Synthetic data; results are not real-world efficacy.
repo_url: https://github.com/lumidren/CyberPulse-SOC-Suite
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: readthedocs
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
validation:
  links:
    # Docs link to rule files, scripts and the changelog outside docs/; tests/test_doc_links.py checks those exist
    not_found: info
    unrecognized_links: info
nav:
