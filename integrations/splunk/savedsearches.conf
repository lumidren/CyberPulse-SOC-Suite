# ==============================================================================
# CyberPulse SOC Suite: Splunk Enterprise Production Saved Searches (SPL)
# Framework: MITRE ATT&CK Enterprise Matrix
# Author: lumidren (https://github.com/lumidren/CyberPulse-SOC-Suite)
# ==============================================================================

[SOC_ALERT_T1003_LSASS_Memory_Dump]
search = index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe" GrantedAccess IN ("0x1010", "0x1400", "0x1F0FFF") NOT SourceImage IN ("*\\svchost.exe", "*\\csrss.exe", "*\\MsMpEng.exe") | table _time host user SourceImage TargetImage GrantedAccess CallTrace
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */2 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
action.webhook = 1
action.webhook.uri = http://cyberpulse-soar:5000/api/simulate
description = Detects unauthorized user-mode process handle acquisition targeting lsass.exe (MITRE T1003.001)

[SOC_ALERT_T1110_RDP_Brute_Force_Spike]
search = index=windows sourcetype="XmlWinEventLog:Security" EventCode=4625 Logon_Type=10 | stats count by IpAddress TargetUserName | where count > 10
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
description = Detects RDP password guessing and brute force spikes exceeding 10 failures in 5 minutes (MITRE T1110.001)

[SOC_ALERT_T1562_Defender_Tampering]
search = index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine="*Set-MpPreference*" AND CommandLine="*DisableRealtimeMonitoring*") | table _time host user CommandLine ParentCommandLine
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */2 * * * *
enableSched = 1
description = Detects PowerShell attempts to disable Windows Defender Real-Time Protection (MITRE T1562.001)
