name: Detection-as-Code CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the workflow token: read-only unless a job asks for more
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-detections:
    name: Sigma & SOAR Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYBERPULSE_LAB_MODE: "true"  # CI is a declared lab: synthetic telemetry only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt
        pip install --require-hashes -r requirements-typecheck.txt

    - name: Lint (ruff, config in pyproject.toml)
      run: ruff check .

    - name: Type check (mypy, strict on safety-critical modules)
      run: mypy

    - name: Run Unit & Integration Tests with coverage (floor in .coveragerc)
      run: |
        coverage run -m unittest discover -s tests -p "test_*.py" -v
        coverage report
        echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

    - name: Validate Sigma syntax with sigma-cli (pySigma)
      if: matrix.python-version == '3.12'
      run: |
        pip install "sigma-cli>=1.0,<2"
        sigma check rules/sigma

    - name: Validate Sigma YAML Schema & MITRE Tags
      run: |
        python -c "
        import os, yaml
        sigma_dir = 'rules/sigma'
        for f in sorted(os.listdir(sigma_dir)):
            if f.endswith('.yml'):
                path = os.path.join(sigma_dir, f)
                with open(path, 'r', encoding='utf-8') as fp:
                    data = yaml.safe_load(fp)
                    assert 'title' in data, f'Missing title in {f}'
                    assert 'id' in data, f'Missing id in {f}'
                    assert 'detection' in data, f'Missing detection block in {f}'
                    assert 'tags' in data, f'Missing MITRE tags in {f}'
                    print(f'[OK] Validated {f}: {data[\"title\"]}')
        "

    - name: Verify Detection Catalogue References Resolve
      run: |
        python -c "
        import os, sys
        sys.path.insert(0, '.')
        from server import DETECTION_CATALOGUE
        missing = [r['sigma_rule'] for r in DETECTION_CATALOGUE if not os.path.exists(r['sigma_rule'])]
        assert not missing, f'Catalogue references missing rule files: {missing}'
        print(f'[OK] All {len(DETECTION_CATALOGUE)} catalogue sigma_rule paths resolve.')
        "

  secret-scan:
    name: Secret Scan (gitleaks + history scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: .gitleaks.toml

    - name: History pattern scan
      run: python scripts/scan_history_secrets.py --allow-known

  security-scan:
    name: Security Scan (pip-audit + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit

    - name: Dependency vulnerability audit (pip-audit)
      run: |
        pip-audit -r requirements.txt --require-hashes
        pip-audit -r requirements-dev.txt --require-hashes

    - name: Static analysis (bandit, medium+ severity fails the build)
      run: bandit -q -r soar simulator scripts server.py start_lab.py -ll
