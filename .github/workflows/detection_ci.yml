name: Detection-as-Code CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-detections:
    name: Sigma & SOAR Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint (flake8 critical errors)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Detection-as-Code Unit & Integration Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Validate Sigma YAML Schema & MITRE Tags
      run: |
        python -c "
        import os, yaml
        sigma_dir = 'rules/sigma'
        for f in sorted(os.listdir(sigma_dir)):
            if f.endswith('.yml'):
                path = os.path.join(sigma_dir, f)
                with open(path, 'r', encoding='utf-8') as fp:
                    data = yaml.safe_load(fp)
                    assert 'title' in data, f'Missing title in {f}'
                    assert 'id' in data, f'Missing id in {f}'
                    assert 'detection' in data, f'Missing detection block in {f}'
                    assert 'tags' in data, f'Missing MITRE tags in {f}'
                    print(f'[OK] Validated {f}: {data[\"title\"]}')
        "

    - name: Verify Detection Catalogue References Resolve
      run: |
        python -c "
        import os, sys
        sys.path.insert(0, '.')
        from server import DETECTION_CATALOGUE
        missing = [r['sigma_rule'] for r in DETECTION_CATALOGUE if not os.path.exists(r['sigma_rule'])]
        assert not missing, f'Catalogue references missing rule files: {missing}'
        print(f'[OK] All {len(DETECTION_CATALOGUE)} catalogue sigma_rule paths resolve.')
        "
