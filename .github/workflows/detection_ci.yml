name: Detection-as-Code CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the workflow token: read-only unless a job asks for more
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-detections:
    name: Sigma & SOAR Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYBERPULSE_LAB_MODE: "true"  # CI is a declared lab: synthetic telemetry only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt
        pip install --require-hashes -r requirements-typecheck.txt

    - name: Lint (ruff, config in pyproject.toml)
      run: ruff check .

    - name: Type check (mypy, strict on safety-critical modules)
      run: mypy

    - name: Run Unit & Integration Tests with coverage (floor in .coveragerc)
      run: |
        coverage run -m unittest discover -s tests -p "test_*.py" -v
        coverage report
        echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

    - name: Validate Sigma syntax with sigma-cli (pySigma)
      if: matrix.python-version == '3.12'
      run: |
        # pySigma 0.11 (pulled in by sigma-cli 1.x) crashes parsing conditions under pyparsing 3.3
        pip install "sigma-cli>=1.0,<2" "pyparsing<3.3"
        sigma check rules/sigma

    - name: Validate Sigma YAML Schema & MITRE Tags
      run: |
        python -c "
        import os, yaml
        sigma_dir = 'rules/sigma'
        for f in sorted(os.listdir(sigma_dir)):
            if f.endswith('.yml'):
                path = os.path.join(sigma_dir, f)
                with open(path, 'r', encoding='utf-8') as fp:
                    data = yaml.safe_load(fp)
                    assert 'title' in data, f'Missing title in {f}'
                    assert 'id' in data, f'Missing id in {f}'
                    assert 'detection' in data, f'Missing detection block in {f}'
                    assert 'tags' in data, f'Missing MITRE tags in {f}'
                    print(f'[OK] Validated {f}: {data[\"title\"]}')
        "

    - name: Verify Detection Catalogue References Resolve
      run: |
        python -c "
        import os, sys
        sys.path.insert(0, '.')
        from server import DETECTION_CATALOGUE
        missing = [r['sigma_rule'] for r in DETECTION_CATALOGUE if not os.path.exists(r['sigma_rule'])]
        assert not missing, f'Catalogue references missing rule files: {missing}'
        print(f'[OK] All {len(DETECTION_CATALOGUE)} catalogue sigma_rule paths resolve.')
        "

  secret-scan:
    name: Secret Scan (gitleaks + history scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout full history
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: .gitleaks.toml

    - name: History pattern scan
      run: python scripts/scan_history_secrets.py --allow-known

  security-scan:
    name: Security Scan (pip-audit + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit

    - name: Dependency vulnerability audit (pip-audit)
      run: |
        pip-audit -r requirements.txt --require-hashes
        pip-audit -r requirements-dev.txt --require-hashes

    - name: Static analysis (bandit, medium+ severity fails the build)
      run: bandit -q -r soar simulator scripts server.py start_lab.py -ll

  docker-smoke:
    name: Docker lab (docker compose up --build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: One-off API key for this run
      run: echo "CYBERPULSE_API_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"

    - name: Start the lab with the README's one command
      run: docker compose up --build --detach

    - name: Wait for the container healthcheck
      run: |
        for i in $(seq 1 40); do
          status=$(docker inspect --format '{{.State.Health.Status}}' cyberpulse-lab)
          echo "attempt $i: $status"
          [ "$status" = "healthy" ] && exit 0
          sleep 3
        done
        exit 1

    - name: Hardening is in effect (read-only root, non-root user, no capabilities)
      run: |
        test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' cyberpulse-lab)" = "true"
        test "$(docker exec cyberpulse-lab id -u)" != "0"
        docker inspect --format '{{.HostConfig.CapDrop}}' cyberpulse-lab | grep -q ALL
        # Published on loopback only
        docker port cyberpulse-lab 5000 | grep -q '^127.0.0.1:5000$'

    - name: Smoke test the API inside the container
      run: |
        curl -fsS http://127.0.0.1:5000/healthz
        for attack in t1003 t1486 cloud_entra; do
          curl -fsS -X POST http://127.0.0.1:5000/api/simulate \
            -H "X-API-Key: $CYBERPULSE_API_KEY" -H "Content-Type: application/json" \
            -d "{\"type\": \"$attack\"}" \
            | python3 -c "import json, sys; i = json.load(sys.stdin)['incident']; print(i['incident_id'], i['status'])"
        done
        curl -fsS -H "X-API-Key: $CYBERPULSE_API_KEY" http://127.0.0.1:5000/api/incidents \
          | python3 -c "import json, sys; d = json.load(sys.stdin); assert len(d['incidents']) >= 3, d.keys(); print(len(d['incidents']), 'incidents')"
        # Unauthenticated API calls are refused
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/incidents)" = "401"

    - name: Container log
      if: always()
      run: docker compose logs --no-color | grep -v "Development API key"

    - name: Stop the lab
      if: always()
      run: docker compose down
