name: Docs

# Builds the MkDocs site on every change (strict mode) and publishes it to GitHub Pages
# from main. Publishing needs Pages enabled with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Build (strict)
      run: |
        pip install -r requirements-docs.txt
        mkdocs build --strict
    - uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      with:
        path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # Until Pages is enabled for the repository, deploy-pages fails with a 404. Skip the
    # deploy with a notice instead; it starts publishing as soon as Pages is switched on.
    - name: Check that GitHub Pages is enabled
      id: pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/pages")
        if [ "$code" = "200" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Docs built, not published::GitHub Pages is not enabled for this repository (API returned $code). Enable it under Settings > Pages > Source: GitHub Actions."
        fi
    - id: deployment
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/deploy-pages@v5
