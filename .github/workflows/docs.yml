name: Docs

# Builds the MkDocs site on every change (strict mode) and publishes it to GitHub Pages
# from main. Publishing needs Pages enabled with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Build (strict)
      run: |
        pip install -r requirements-docs.txt
        mkdocs build --strict
    - uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      with:
        path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
