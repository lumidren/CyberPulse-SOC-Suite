name: Release

# Push a tag like v3.0.0 to publish a GitHub release. The tag must match the
# version in pyproject.toml / server.py and have a CHANGELOG.md section.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYBERPULSE_LAB_MODE: "true"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt

    - name: Tests must pass on the tagged commit
      run: python -m unittest discover -s tests -p "test_*.py"

    - name: Tag must match the project version
      run: |
        python scripts/release_notes.py --check "${GITHUB_REF_NAME#v}"

    - name: Extract release notes from CHANGELOG.md
      run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
