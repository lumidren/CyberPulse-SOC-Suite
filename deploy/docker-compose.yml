version: '3.8'

services:
  wazuh-indexer:
    image: opensearchproject/opensearch:2.11.0
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "discovery.type=single-node"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:?Set OPENSEARCH_ADMIN_PASSWORD in your .env}"
      - "plugins.security.ssl.http.enabled=false"
    volumes:
      - wazuh-indexer-data:/usr/share/opensearch/data
    networks:
      soc-net:
        ipv4_address: 10.0.1.5

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514/tcp"
      - "1515:1515/tcp"
      - "55000:55000/tcp"
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
    volumes:
      - ./wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./wazuh/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
    depends_on:
      - wazuh-indexer
    networks:
      soc-net:
        ipv4_address: 10.0.1.10

  thehive:
    image: thehiveproject/thehive:5.2
    container_name: thehive-cases
    restart: always
    ports:
      - "9000:9000"
    environment:
      - "JAVA_OPTS=-Xms256m -Xmx512m"
    networks:
      soc-net:
        ipv4_address: 10.0.1.20

  soar-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.soar
    container_name: cyberpulse-soar
    restart: always
    ports:
      - "127.0.0.1:5000:5000"   # publish on loopback only; front with a TLS proxy to expose
    environment:
      - CYBERPULSE_ENV=production
      - CYBERPULSE_LAB_MODE=${CYBERPULSE_LAB_MODE:-false}
      - CYBERPULSE_API_KEY=${CYBERPULSE_API_KEY:?Set CYBERPULSE_API_KEY in your .env}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-http://localhost:5000}
      - WAZUH_API_URL=https://wazuh-manager:55000
      - THEHIVE_URL=http://thehive:9000
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - wazuh-manager
    networks:
      soc-net:
        ipv4_address: 10.0.1.15

networks:
  soc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24

volumes:
  wazuh-indexer-data:
