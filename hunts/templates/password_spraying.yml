name: Slow password spraying
hypothesis: A single source fails logons as many different accounts, slowly enough to dodge per-account thresholds.
attack: [T1110.003]
data_sources: [Security 4625]
steps:
  - type: stack
    field: target_user
    where_field: event_id
    where_value: "4625"
    note: Many accounts with one or two failures each is the spraying shape.
  - type: stack
    field: source_ip
    where_field: event_id
    where_value: "4625"
benign: [A NATed office or VPN after a password policy change, Scanners with service-account wordlists]
next_steps:
  - Pivot on the busiest source IP and check for any successful logon (4624) afterwards
