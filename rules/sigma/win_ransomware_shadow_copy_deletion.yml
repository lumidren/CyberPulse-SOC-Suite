title: Volume Shadow Copy Deletion or Resizing
id: 5b6a633a-0b54-4b1e-b9c6-02274372614f
status: experimental
description: Detects deletion or shrinking of Volume Shadow Copies via vssadmin, wmic or PowerShell, done by ransomware
    just before encryption so files cannot be restored.
references:
- https://attack.mitre.org/techniques/T1490/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.impact
- attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains:
        - delete shadows
        - resize shadowstorage
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
        - shadowcopy
        - delete
    selection_powershell:
        Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
        CommandLine|contains|all:
        - Win32_ShadowCopy
        - Delete
    condition: 1 of selection_*
falsepositives:
- Backup software pruning its own shadow copies (allowlist the backup agent as parent)
level: critical
