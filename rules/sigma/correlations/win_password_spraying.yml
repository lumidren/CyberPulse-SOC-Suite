title: Failed Network or RDP Logon for Spraying (base rule)
name: failed_logon_for_spray
id: 6d7b8e0a-3c1f-4f7e-9d2a-5b1e0c4a7f33
status: experimental
description: >-
    Raw EventID 4625 for a network or RDP logon with a bad password or unknown user
    (SubStatus 0xC000006A / 0xC0000064). Not an alert on its own.
author: lumidren (CyberPulse SOC Suite)
date: 2026-11-01
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType:
            - 3
            - 10
        SubStatus:
            - '0xc000006a'
            - '0xc0000064'
    aggregated:
        FailedAttemptsCount: null
    condition: selection and aggregated
level: informational
---
title: Password Spraying From One Source (distinct accounts correlation)
id: f14f3940-a592-4d15-a910-c55fefe12985
status: experimental
description: >-
    One source IP fails to log on as ten or more different accounts within 30 minutes.
    Spraying slower than that (a few guesses per day) is still missed; that needs a
    long-window behavioural baseline, not a correlation rule.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: lumidren (CyberPulse SOC Suite)
date: 2026-11-01
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - failed_logon_for_spray
    group-by:
        - IpAddress
    timespan: 30m
    condition:
        gte: 10
        field: TargetUserName
falsepositives:
    - A shared jump host or VPN concentrator where many users mistype passwords (one NATed source IP).
    - Vulnerability scanners running authenticated checks with a wordlist of service accounts.
level: high
