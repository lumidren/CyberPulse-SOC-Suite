title: Executable Downloaded over HTTP by a Script Client or to a Raw IP
id: d8a85241-b6b3-41e4-9cdd-a3db2a62b4f9
status: experimental
description: Zeek saw a Windows executable (MIME application/x-dosexec) fetched over plain HTTP by a scripting or
    LOLBin user agent, or straight from an IP address instead of a host name.
references:
- https://attack.mitre.org/techniques/T1105/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.command-and-control
- attack.t1105
logsource:
    product: zeek
    service: http
detection:
    selection_exe:
        resp_mime_types|contains: application/x-dosexec
    selection_ua:
        user_agent|contains:
        - WindowsPowerShell
        - Microsoft-CryptoAPI
        - BITS
        - curl
        - Wget
    selection_raw_ip:
        host|re: '^[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?$'
    condition: selection_exe and (selection_ua or selection_raw_ip)
falsepositives:
- Software updaters that download installers over HTTP from IP-addressed mirrors
- Admin scripts pulling tools from an internal web server by IP
level: high
