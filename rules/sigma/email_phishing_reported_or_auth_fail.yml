title: Phishing Email Reported by a User or Failing DMARC with a Link or Attachment
id: 20e00c9f-8021-435b-9387-9d4e9f247d7e
status: experimental
description: A delivered message that a recipient reported as phishing, or that failed DMARC and carries a link
    or attachment. Message metadata only (Microsoft 365 EmailEvents style); no bodies.
references:
- https://attack.mitre.org/techniques/T1566/001/
- https://attack.mitre.org/techniques/T1566/002/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.initial-access
- attack.t1566.001
- attack.t1566.002
logsource:
    product: m365
    service: email
detection:
    selection_delivered:
        DeliveryAction: Delivered
    selection_reported:
        ReportedByUser: true
    selection_dmarc_fail:
        AuthenticationResults|contains: dmarc=fail
    selection_link:
        Urls|exists: true
    selection_attachment:
        AttachmentSha256|exists: true
    condition: selection_delivered and (selection_reported or (selection_dmarc_fail and (selection_link or selection_attachment)))
falsepositives:
- Newsletters and SaaS senders with broken DMARC alignment
- Users reporting legitimate but unexpected mail
level: high
