title: Password-Protected Archive Created with 7-Zip or WinRAR
id: 11940016-c3a0-48c4-9684-8791939b2632
status: experimental
description: Detects 7-Zip or WinRAR creating an archive with a password (-p), a typical staging step before exfiltrating
    collected data.
references:
- https://attack.mitre.org/techniques/T1560/001/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.collection
- attack.t1560.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
        - '\7z.exe'
        - '\7za.exe'
        - '\rar.exe'
        - '\WinRAR.exe'
    selection_add:
        CommandLine|contains:
        - ' a '
        - ' -a '
    selection_password:
        CommandLine|contains:
        - ' -p'
        - ' -hp'
    condition: all of selection_*
falsepositives:
- Users protecting archives they email; backup scripts that encrypt archives
level: medium
