title: TLS Client Fingerprint on the Local JA3/JA4 Blocklist
id: 9816dd19-d474-400a-822b-b5d4160cd4b4
status: experimental
description: 'A TLS client whose JA3 or JA4 fingerprint is on the blocklist in this rule. The shipped values are
    SYNTHETIC LAB PLACEHOLDERS, not real malware fingerprints: load your own list (for example the abuse.ch SSLBL
    JA3 list) with scripts/update_tls_blocklist.py. A fingerprint identifies a TLS library and its settings, not
    a program, so legitimate software can share one.'
references:
- https://attack.mitre.org/techniques/T1071/001/
- https://attack.mitre.org/techniques/T1573/002/
- https://github.com/FoxIO-LLC/ja4
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.command_and_control
- attack.t1071.001
- attack.t1573.002
logsource:
    product: zeek
    service: ssl
detection:
    selection_ja3:
        ja3:
        - 0000000000000000000000000000c0de
        - 0000000000000000000000000000beef
    selection_ja4:
        ja4:
        - t00d0000h0_000000000000_00000000c0de
    condition: 1 of selection_*
falsepositives:
- Legitimate software built on the same TLS library and settings as a listed tool
- Stale blocklist entries; review the list's source and age
level: high
