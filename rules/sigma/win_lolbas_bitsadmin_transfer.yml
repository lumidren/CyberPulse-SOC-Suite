title: BITSAdmin Download or Job Creation
id: 8e4fee5a-cc32-4c24-9a8f-d9ce617ddea6
status: experimental
description: Detects bitsadmin.exe creating or running transfer jobs, which attackers use to download payloads and
    to persist via BITS job notify commands.
references:
- https://attack.mitre.org/techniques/T1197/
- https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.defense_evasion
- attack.persistence
- attack.t1197
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\bitsadmin.exe'
    selection_cli:
        CommandLine|contains:
        - /transfer
        - /addfile
        - /SetNotifyCmdLine
        - /download
    condition: selection_img and selection_cli
falsepositives:
- Legacy software update scripts that still use bitsadmin (most use BITS PowerShell cmdlets now)
level: medium
