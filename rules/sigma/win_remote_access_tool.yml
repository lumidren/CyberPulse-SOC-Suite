title: Remote Access Tool Started from a User-Writable Path
id: 5bf9140c-2ccd-46e7-9739-c3792f641191
status: experimental
description: Detects AnyDesk, TeamViewer, ScreenConnect, Atera or similar remote-access tools running from Downloads,
    Temp, AppData or Public, often installed by intruders for persistent hands-on access.
references:
- https://attack.mitre.org/techniques/T1219/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.command-and-control
- attack.t1219
logsource:
    product: windows
    category: process_creation
detection:
    selection_tool:
        Image|endswith:
        - '\AnyDesk.exe'
        - '\TeamViewer.exe'
        - '\ScreenConnect.ClientService.exe'
        - '\AteraAgent.exe'
        - '\rustdesk.exe'
    selection_path:
        Image|contains:
        - '\Downloads\'
        - '\Temp\'
        - '\AppData\'
        - '\Users\Public\'
    condition: selection_tool and selection_path
falsepositives:
- Helpdesk staff running a portable remote-support tool; allowlist the sanctioned one
level: medium
