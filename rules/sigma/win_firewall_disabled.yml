title: Windows Firewall Disabled via netsh or PowerShell
id: 4f2db321-d744-4a92-8636-8f6747f670d9
status: experimental
description: Detects the host firewall being turned off for all profiles with netsh advfirewall or Set-NetFirewallProfile
    -Enabled False.
references:
- https://attack.mitre.org/techniques/T1562/004/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_netsh:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
        - advfirewall
        - state off
    selection_ps:
        CommandLine|contains|all:
        - Set-NetFirewallProfile
        - -Enabled
        - 'False'
    condition: 1 of selection_*
falsepositives:
- Troubleshooting by network administrators on isolated test hosts
level: high
