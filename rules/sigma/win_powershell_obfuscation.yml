title: Obfuscated PowerShell Execution Cradle
id: 7d4b9e21-63fa-4c8e-9b1d-5a2e0f8c3d47
status: experimental
description: Detects obfuscated or policy-bypassing PowerShell invocations commonly used by download cradles and in-memory stagers, including encoded commands, profile bypass, and hidden windows.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberPulse SOC Suite
date: 2026/08/21
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - '-nop'
            - '-NoProfile'
            - '-WindowStyle Hidden'
            - 'IEX('
            - 'Invoke-Expression'
            - 'DownloadString'
    condition: selection_img and selection_flags
falsepositives:
    - Legitimate management frameworks (SCCM, Intune) occasionally invoke encoded commands; baseline and allowlist known signers.
level: high
