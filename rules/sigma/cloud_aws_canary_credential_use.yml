title: AWS Canary Credential Used
id: 6da749e3-8201-4892-8faa-212df737dc73
status: experimental
description: Any CloudTrail call by the IAM user that owns a planted canary access key. The key has no permissions
    and is left in files an intruder would loot (config backups, scripts), so any call means the file was stolen.
references:
- https://attack.mitre.org/techniques/T1552/001/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.credential-access
- attack.t1552.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        userIdentity.userName:
        - canary-backup-reader
        - canary-ci-deployer
    condition: selection
falsepositives:
- Your own periodic test of the canary (record the test window)
level: critical
