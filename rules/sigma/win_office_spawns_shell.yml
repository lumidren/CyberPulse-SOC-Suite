title: Office Application Spawning a Shell or Script Host
id: 23817aaf-3f8a-4fe0-9c5b-6c3e95fbe25c
status: experimental
description: Detects Word, Excel, PowerPoint or Outlook starting cmd, PowerShell, wscript, cscript or mshta, the
    usual first step of a malicious macro or phishing attachment.
references:
- https://attack.mitre.org/techniques/T1566/001/
- https://attack.mitre.org/techniques/T1204/002/
author: lumidren (CyberPulse SOC Suite)
date: '2026-11-01'
modified: '2026-11-01'
tags:
- attack.initial-access
- attack.execution
- attack.t1566.001
- attack.t1204.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
        - '\WINWORD.EXE'
        - '\EXCEL.EXE'
        - '\POWERPNT.EXE'
        - '\OUTLOOK.EXE'
    selection_child:
        Image|endswith:
        - '\cmd.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
        - '\wscript.exe'
        - '\cscript.exe'
        - '\mshta.exe'
    condition: selection_parent and selection_child
falsepositives:
- Approved Office add-ins that shell out (allowlist by command line)
level: high
