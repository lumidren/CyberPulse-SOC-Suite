# Techniques this lab aims to detect (roadmap F11).
#
# The gap report (docs/coverage/GAPS.md, generated by scripts/coverage_report.py)
# lists every target below that no Sigma rule is tagged with. Techniques the
# attack simulator emits are added automatically, so "simulated but undetected"
# can never go unnoticed.
#
# `why` is the reason the technique is on the list; `blocker` (optional) records
# what is missing to cover it - an accepted gap rather than an oversight.
targets:
  T1003.001: {name: "OS Credential Dumping: LSASS Memory", tactic: credential-access, why: "Core credential theft path in AD labs"}
  T1003.006: {name: "OS Credential Dumping: DCSync", tactic: credential-access, why: "Domain-wide credential compromise"}
  T1110.001: {name: "Brute Force: Password Guessing", tactic: credential-access, why: "Common against exposed RDP"}
  T1110.003: {name: "Brute Force: Password Spraying", tactic: credential-access, why: "Spraying evades per-account thresholds; SOC-RULE-044 covers bursts within 30 minutes, slower spraying is still missed"}
  T1555.003: {name: "Credentials from Password Stores: Credentials from Web Browsers", tactic: credential-access, why: "Common infostealer behaviour",
              blocker: "Needs Sysmon file-access auditing on browser profile paths (SACLs), not collected in the lab"}
  T1557.001: {name: "Adversary-in-the-Middle: LLMNR/NBT-NS Poisoning", tactic: credential-access, why: "Frequent internal-network finding",
              blocker: "Zeek ingest exists (F72) but no rule yet: needs LLMNR/NBT-NS traffic in conn.log and a baseline of name-resolution responders"}
  T1053.005: {name: "Scheduled Task/Job: Scheduled Task", tactic: persistence, why: "Most common Windows persistence"}
  T1547.001: {name: "Boot or Logon Autostart Execution: Registry Run Keys", tactic: persistence, why: "Common persistence"}
  T1543.003: {name: "Create or Modify System Process: Windows Service", tactic: persistence, why: "Persistence and lateral movement"}
  T1136.001: {name: "Create Account: Local Account", tactic: persistence, why: "Backdoor accounts"}
  T1059.001: {name: "Command and Scripting Interpreter: PowerShell", tactic: execution, why: "Dominant execution method"}
  T1047: {name: "Windows Management Instrumentation", tactic: execution, why: "Remote execution"}
  T1562.001: {name: "Impair Defenses: Disable or Modify Tools", tactic: defense-evasion, why: "Precedes ransomware"}
  T1070.001: {name: "Indicator Removal: Clear Windows Event Logs", tactic: defense-evasion, why: "Anti-forensics"}
  T1027: {name: "Obfuscated Files or Information", tactic: defense-evasion, why: "Broad evasion family",
          blocker: "Only the encoded-PowerShell sub-case is covered (SOC-RULE-004); file-level obfuscation needs content inspection (YARA, F70)"}
  T1036.003: {name: "Masquerading: Rename System Utilities", tactic: defense-evasion, why: "Renamed binaries defeat name-based rules (F29)",
              blocker: "Needs OriginalFileName in process telemetry and a rule comparing it to Image"}
  T1055: {name: "Process Injection", tactic: defense-evasion, why: "Common in-memory tradecraft",
          blocker: "Needs kernel ETW (Microsoft-Windows-Threat-Intelligence); Sysmon does not see thread-context changes"}
  T1021.001: {name: "Remote Services: Remote Desktop Protocol", tactic: lateral-movement, why: "Lateral movement in Windows estates",
              blocker: "Legitimate RDP is constant in the lab; needs a baseline of normal source/destination pairs (F13)"}
  T1021.002: {name: "Remote Services: SMB/Windows Admin Shares", tactic: lateral-movement, why: "PsExec-style lateral movement"}
  T1550.002: {name: "Use Alternate Authentication Material: Pass the Hash", tactic: lateral-movement, why: "Credential reuse"}
  T1087.002: {name: "Account Discovery: Domain Account", tactic: discovery, why: "Early AD reconnaissance"}
  T1018: {name: "Remote System Discovery", tactic: discovery, why: "Host enumeration before lateral movement",
          blocker: "High benign volume from admin tooling; not yet tuned"}
  T1071.004: {name: "Application Layer Protocol: DNS", tactic: command-and-control, why: "DNS tunnelling and beaconing (F73)",
              blocker: "Needs DNS query logs; no resolver logging in the lab"}
  T1105: {name: "Ingress Tool Transfer", tactic: command-and-control, why: "Tool download via LOLBins"}
  T1048: {name: "Exfiltration Over Alternative Protocol", tactic: exfiltration, why: "DNS/ICMP exfiltration",
          blocker: "Zeek ingest exists (F72); volume-based exfiltration needs per-host byte baselines not built yet"}
  T1567.002: {name: "Exfiltration Over Web Service: Exfiltration to Cloud Storage", tactic: exfiltration, why: "rclone-style exfiltration"}
  T1486: {name: "Data Encrypted for Impact", tactic: impact, why: "Ransomware"}
  T1490: {name: "Inhibit System Recovery", tactic: impact, why: "Shadow-copy deletion precedes encryption"}
  T1078.004: {name: "Valid Accounts: Cloud Accounts", tactic: initial-access, why: "Cloud identity abuse"}
  T1566.001: {name: "Phishing: Spearphishing Attachment", tactic: initial-access, why: "Most common initial access"}
  T1190: {name: "Exploit Public-Facing Application", tactic: initial-access, why: "Edge-device exploitation",
          blocker: "Needs web/WAF logs; the lab has no public-facing application"}
  T1068: {name: "Exploitation for Privilege Escalation", tactic: privilege-escalation, why: "Vulnerable-driver (BYOVD) attacks"}
  T1552.001: {name: "Unsecured Credentials: Credentials In Files", tactic: credential-access, why: "Looted config files and scripts; covered by canary credentials (F16)"}
