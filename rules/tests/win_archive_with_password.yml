# Positive/negative samples for rules/sigma/win_archive_with_password.yml (synthetic lab events)
rule: win_archive_with_password.yml
positive:
- name: 7z archive with password
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Program Files\7-Zip\7z.exe'
      CommandLine: '7z.exe a -pS3cr3t -mhe=on C:\Users\Public\out.7z C:\Finance\*'
      ParentImage: 'C:\Windows\System32\cmd.exe'
negative:
- name: 7z extraction
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Program Files\7-Zip\7z.exe'
      CommandLine: '7z.exe x C:\Downloads\tools.7z -oC:\Tools'
      ParentImage: 'C:\Windows\System32\cmd.exe'
