# Positive/negative samples for rules/sigma/cloud_aws_canary_credential_use.yml (synthetic lab events)
rule: cloud_aws_canary_credential_use.yml
positive:
- name: Canary key lists buckets
  event:
    event_id: 9901
    event_source: aws:cloudtrail
    source_ip: 198.51.100.40
    details:
      eventName: ListBuckets
      eventSource: s3.amazonaws.com
      userIdentity.userName: canary-backup-reader
- name: Canary key identity check
  event:
    event_id: 9901
    event_source: aws:cloudtrail
    source_ip: 198.51.100.40
    details:
      eventName: GetCallerIdentity
      eventSource: s3.amazonaws.com
      userIdentity.userName: canary-ci-deployer
negative:
- name: Real pipeline user
  event:
    event_id: 9901
    event_source: aws:cloudtrail
    source_ip: 198.51.100.40
    details:
      eventName: ListBuckets
      eventSource: s3.amazonaws.com
      userIdentity.userName: ci-deploy-pipeline
