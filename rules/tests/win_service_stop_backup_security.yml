# Positive/negative samples for rules/sigma/win_service_stop_backup_security.yml (synthetic lab events)
rule: win_service_stop_backup_security.yml
positive:
- name: Stop Veeam service
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\net.exe'
      CommandLine: net stop "VeeamBackupSvc" /y
      ParentImage: 'C:\Windows\System32\cmd.exe'
- name: Disable VSS via sc
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\sc.exe'
      CommandLine: sc config vss start= disabled
      ParentImage: 'C:\Windows\System32\cmd.exe'
negative:
- name: Query service state
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\sc.exe'
      CommandLine: sc query wbengine
      ParentImage: 'C:\Windows\System32\cmd.exe'
- name: Stop print spooler
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\net.exe'
      CommandLine: net stop spooler
      ParentImage: 'C:\Windows\System32\cmd.exe'
