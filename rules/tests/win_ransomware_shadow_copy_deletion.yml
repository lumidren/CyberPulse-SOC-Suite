# Positive/negative samples for rules/sigma/win_ransomware_shadow_copy_deletion.yml (synthetic lab events)
rule: win_ransomware_shadow_copy_deletion.yml
positive:
- name: vssadmin delete all shadows
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\vssadmin.exe'
      CommandLine: vssadmin.exe Delete Shadows /All /Quiet
      ParentImage: 'C:\Users\Public\locker.exe'
- name: wmic shadowcopy delete
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\wbem\wmic.exe'
      CommandLine: wmic shadowcopy delete /nointeractive
      ParentImage: 'C:\Users\Public\locker.exe'
- name: PowerShell CIM delete
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      CommandLine: powershell Get-WmiObject Win32_ShadowCopy | ForEach-Object { $_.Delete() }
      ParentImage: 'C:\Users\Public\locker.exe'
negative:
- name: Backup job lists shadows
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\vssadmin.exe'
      CommandLine: vssadmin.exe list shadows
      ParentImage: 'C:\Users\Public\locker.exe'
- name: Backup job creates a shadow
  event:
    event_id: 1
    event_source: Microsoft-Windows-Sysmon/Operational
    details:
      Image: 'C:\Windows\System32\vssadmin.exe'
      CommandLine: 'vssadmin.exe create shadow /for=C:'
      ParentImage: 'C:\Users\Public\locker.exe'
