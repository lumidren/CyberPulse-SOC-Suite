# SOAR mapping for the Sigma rules in rules/sigma/ (keyed by Sigma rule id).
#
# Sigma rules stay vendor-neutral; everything the lab's SOAR pipeline needs
# (stable SOC rule id, display name, response playbook, severity override)
# lives here. A Sigma rule without an entry still detects, but only alerts
# (ENRICH_AND_ALERT_ANALYST) and is reported by the rule lint.
rules:
  4b29381e-7f61-419b-a312-d9c0e3528b10:
    soc_rule_id: SOC-RULE-001
    name: Possible LSASS Memory Dumping via Sysmon Event 10
    action_recommended: ISOLATE_HOST_AND_KILL_PROCESS
  9a8d420f-21b4-4e12-b91c-223405fae38e:
    soc_rule_id: SOC-RULE-002
    name: High Volume Brute Force Authentication Spike
    action_recommended: BLOCK_SOURCE_IP_FIREWALL
  5e61234a-9c2b-4781-a901-d85712ef9100:
    soc_rule_id: SOC-RULE-003
    name: Suspicious Scheduled Task Creation for Persistence
    action_recommended: REMOVE_SCHEDULED_TASK
  7d4b9e21-63fa-4c8e-9b1d-5a2e0f8c3d47:
    soc_rule_id: SOC-RULE-004
    name: Obfuscated PowerShell Execution Detected
    action_recommended: TERMINATE_PROCESS_TREE
  c382910a-814d-4b92-962a-8921df0102aa:
    soc_rule_id: SOC-RULE-005
    name: Windows Defender Real-Time Protection Disabled
    action_recommended: REVERT_DEFENDER_POLICY_AND_ISOLATE
  a74198c2-3e21-4f12-a892-38472910cdee:
    soc_rule_id: SOC-RULE-006
    name: Rapid Ransomware Canary File Encryption Detected
    action_recommended: KILL_RANSOMWARE_PROCESS_AND_RESTORE_VSS
  9a38df41-6c23-4e89-a112-984712019481:
    soc_rule_id: SOC-RULE-007
    name: Kerberoasting TGS Ticket Request with RC4 Encryption
    action_recommended: RESET_SERVICE_ACCOUNT_AND_REVOKE_KERBEROS_TICKET
  b41289cf-1123-4482-9912-781290341829:
    soc_rule_id: SOC-RULE-008
    name: Active Directory Replication Abuse (DCSync) Detected
    action_recommended: ISOLATE_ACCOUNT_AND_REVOKE_REPLICATION_PRIVILEGES
  d7e8f9a0-b1c2-4345-a678-9abcdef01234:
    soc_rule_id: SOC-RULE-009
    name: Suspicious Cross-Account AWS STS AssumeRole Abuse
    action_recommended: REVOKE_AWS_STS_SESSION_AND_ATTACH_DENY_POLICY
  e8f9a0b1-c2d3-4456-b789-0abcdef12345:
    soc_rule_id: SOC-RULE-010
    name: Microsoft Entra ID Impossible Travel Anomaly
    action_recommended: REVOKE_ENTRA_REFRESH_TOKENS_AND_FORCE_MFA
  f1a2b3c4-d5e6-4789-a012-3456789abcde:
    soc_rule_id: SOC-RULE-011
    name: Vulnerable Kernel Driver Load (BYOVD Defense Evasion)
    action_recommended: UNLOAD_DRIVER_AND_ENFORCE_WDAC_BLOCK
