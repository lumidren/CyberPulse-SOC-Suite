name: credential-theft
version: 1.0.0
description: Credential dumping, ticket theft and credential reuse (LSASS, DCSync, Kerberoasting, pass-the-hash).
match:
  techniques: [T1003, T1558, T1550]
response:
  require_approval: true
  notify: true
tasks:
  - Identify the process and account that accessed the credential material
  - Collect the volatile evidence package before approving any isolation
  - List accounts with sessions on the host; plan password resets for exposed accounts
  - Check domain controllers for follow-on use (4624 logon type 3/9, 4769 from the same source)
